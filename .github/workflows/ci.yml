# The package's CI: glitchr-studio/ci's reusable workflow (the PHP 8.4 image, the package installed
# alone, PHPUnit, PHPStan against phpstan-baseline.neon, a consumer install without require-dev).
name: ci

on:
  push:
    branches: ['1.x']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  package:
    uses: glitchr-studio/ci/.github/workflows/php-package.yml@main
    with:
      smoke-class: 'Omnidns\Ovh\OvhProvider'
